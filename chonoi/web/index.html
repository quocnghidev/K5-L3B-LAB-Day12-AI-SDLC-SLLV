<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 18px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp. CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input, /control.
 * Hình khối 2D tạm. Chữ HUD không chân >= 18 px (Ticket-02).
 * Phím: WASD / mũi tên = di chuyển · E = tương tác · Space = bắt cá · Esc/P = tạm dừng
 *       Shop: 1 = bình oxy, 2 = áo phao, Enter = đóng Shop · Màn hình giới thiệu: Enter / Space để tiếp
 *       R = chơi lại (gather/quan) · M = về menu (trong pause) · H = bật/tắt tương phản cao (hoặc ?contrast=1)
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false, quitted = false;
const HUD = 18;  // cỡ chữ HUD tối thiểu (px)
// ---------- tương phản cao (Ticket-04): nền đen, chữ trắng/vàng, cảnh báo khung vàng dày ----------
let HC = new URLSearchParams(location.search).get("contrast") === "1";
try { if (localStorage.getItem("chonoi.contrast") === "1") HC = true; } catch (e) { /* bỏ qua */ }
function toggleHC() { HC = !HC; try { localStorage.setItem("chonoi.contrast", HC ? "1" : "0"); } catch (e) { /* bỏ qua */ } }
let warnings = [];  // banner cảnh báo của khung hình hiện tại: [chữ, màu]
function warn(msg, color) { warnings.push([msg, color]); }
function drawWarnings(w) {
  warnings.forEach(([msg, color], i) => {
    const y = 104 + i * 46, bw = Math.min(w - 40, 520);
    ctx.fillStyle = HC ? "#000" : "rgba(20,10,30,.85)"; ctx.fillRect((w - bw) / 2, y - 30, bw, 40);
    ctx.strokeStyle = HC ? "#ffeb3b" : color; ctx.lineWidth = HC ? 5 : 3; ctx.strokeRect((w - bw) / 2, y - 30, bw, 40);
    text(msg, w / 2, y, { size: HC ? 26 : 24, align: "center", bold: true, color: HC ? "#ffeb3b" : color });
  });
  warnings = [];
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function post(path, obj) {
  queue.push([path, JSON.stringify(obj || {})]);
  flush();
}
function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
           pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(["/input", s]);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const [path, body] = queue.shift();
    try { await fetch(path, { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }

// ---------- màn hình chờ (menu, DayIntro, EveningIntro, DayResult) ----------
let introShownAt = 0, introKey = null;
function release() { post("/control", { hold: false }); down.clear(); lastSent = ""; }
function onIntroKey(k) {
  if (snap.intro === "menu") {
    if (k === "enter" || k === " ") { post("/control", { intro: "day" }); }
    else if (k === "q") { fetch("/quit", { method: "POST" }); quitted = true; }
    return;
  }
  if (k === "enter" || k === " " || k === "e") release();
}

addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
  if (e.repeat) return;
  if (snap && snap.ui_hold && snap.intro) { onIntroKey(k); return; }
  if (snap && snap.mode === "day" && snap.state === "finished") { if (k === "enter" || k === "m") post("/control", { menu: true }); return; }
  if (snap && snap.state === "paused" && k === "m") { post("/control", { menu: true }); down.clear(); lastSent = ""; return; }
  if (MOVE_KEYS[k]) down.add(MOVE_KEYS[k]);
  else if (k === "e") down.add(snap && snap.phase === "shop" ? "shop_done" : "interact");
  else if (k === " ") down.add("catch");
  else if (k === "escape" || k === "p") down.add("pause");
  else if (k === "enter" && snap && snap.phase === "shop") down.add("shop_done");
  else if ((k === "1" || k === "2") && snap && snap.phase === "shop") post("/input", { buy: k === "1" ? "oxygen" : "hp" });
  else if (k === "r" && snap && snap.mode !== "day") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "h") toggleHC();
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") { down.delete("interact"); down.delete("shop_done"); }
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  if (snap && snap.ui_hold && snap.intro) {
    if (snap.intro !== introKey) { introKey = snap.intro; introShownAt = performance.now(); }
    // DayIntro tự chuyển sau 4 s
    if (snap.intro === "day" && performance.now() - introShownAt > 4000) { introKey = null; release(); }
  } else introKey = null;
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ: tiện ích ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng muối ớt", lau_mam: "Lẩu mắm miền Tây" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const kn = (k) => KIND_NAME[k] || k;
const dn = (d) => DISH_NAME[d] || d;
const blink = () => Math.floor(performance.now() / 250) % 2 === 0;

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + (o.size || HUD) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 4, { align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
// ----- độ tươi (v1.2) -----
const SPOIL = 30;
const isSpoiled = (it) => it && typeof it === "object" && it.fresh < SPOIL;
function freshColor(f) { return f < SPOIL ? "#8d8d8d" : f < 60 ? "#ffb74d" : "#81c784"; }
function itemCell(it, x0, y0, sz) {
  // ô cá thể: màu loại, thanh tươi dưới đáy, xám + "ươn" khi fresh < 30
  const sp = isSpoiled(it);
  ctx.fillStyle = sp ? "#5f5f5f" : kc(it.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 12);
  ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(x0 + 3, y0 + sz - 8, sz - 6, 5);
  ctx.fillStyle = freshColor(it.fresh); ctx.fillRect(x0 + 3, y0 + sz - 8, (sz - 6) * Math.max(0, Math.min(1, it.fresh / 100)), 5);
  if (sp) text("ươn", x0 + sz / 2, y0 + sz / 2 + 2, { size: 12, align: "center", color: "#fff", bold: true });
}
function counts(arr) { const c = {}; (arr || []).forEach((k) => (c[k] = (c[k] || 0) + 1)); return c; }
function panel(w, h, pw, ph) {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
  const x = (w - pw) / 2, y = (h - ph) / 2;
  ctx.fillStyle = "#1d2a33"; ctx.fillRect(x, y, pw, ph);
  ctx.strokeStyle = "#f2c230"; ctx.lineWidth = 2; ctx.strokeRect(x, y, pw, ph);
  return [x, y];
}
function lines(arr, x, y, step = 30, o = {}) { arr.forEach((s, i) => text(s, x, y + i * step, o)); }
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-4);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 104 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.6)" }));
}
function timeColor(t) { return t <= 1800 ? (blink() ? "#ff8a80" : "#ffcc80") : "#e8eef2"; }

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 96, bottom = 84;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  ctx.fillStyle = HC ? "#1a1a1a" : "#f6c79a"; ctx.fillRect(0, top, w, SKY * s);  // ánh hồng buổi sớm
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#b98a4e"); g.addColorStop(0.5, "#8c6431"); g.addColorStop(1, "#2e1f10");  // nước phù sa
  ctx.fillStyle = HC ? "#001a33" : g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#fff3d6"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  for (let d = 10; d <= D; d += 10) {
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 3, { size: 12, color: "rgba(255,255,255,.5)" });
  }
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 12, align: "center", color: "#5a3a22" });
  });
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
  });
  const species = (meta.monsters || {}).species || {};
  let monsterNear = false;
  const p = snap.player;
  (snap.monsters || []).forEach((m) => {
    const col = HC ? "#ff1744" : m.state === "chase" ? "#a270ea" : m.state === "recoil" ? "#6b5a80" : "#3b1f4f";
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 1.8 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = HC ? "#fff" : "#cba6ff"; ctx.lineWidth = HC ? 4 : 2; ctx.stroke();
    text("⚠", sx(m.pos[0]), sy(m.pos[1]) - 0.8 * s, { size: 22, align: "center", color: HC ? "#ffeb3b" : "#cba6ff", bold: true });
    const sp = species[m.kind] || {};
    if (p && (m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= (sp.detect_radius || 10))) monsterNear = true;
  });
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#3e7b3a"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();  // áo bà ba
      if (HC) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke(); }
      ctx.fillStyle = "#c8102e"; ctx.fillRect(px - 0.6 * s, py - 0.75 * s, 1.2 * s, 0.25 * s);  // khăn rằn
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
    // gợi ý
    const hints = [];
    if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr) hints.push("E: cập bến");
    else if (!underwater) {
      const n = (snap.nodes || []).find((n) => n.ready !== false && Math.hypot(n.pos[0] - p.pos[0], n.pos[1] - p.pos[1]) <= (meta.interact_radius || 2));
      if (n) hints.push("E: hái " + kn(n.kind));
    } else {
      const f = (snap.fish || []).find((f) => Math.hypot(f.pos[0] - p.pos[0], f.pos[1] - p.pos[1]) <= (meta.catch_radius || 2));
      if (f) hints.push("Space: bắt " + kn(f.kind));
    }
    if (hints.length) text(hints.join(" · "), px, py - 1.2 * s, { align: "center", color: "#fff3d6", bold: true });
  }
  // ----- HUD -----
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 32, { size: 24, color: timeColor(snap.time_left_ticks) });
  if (p && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(120, 12, 240, 26, p.oxygen_ticks / p.oxygen_max_ticks, low ? (blink() ? "#ef5350" : "#ff8a65") : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp_max) {
    let hs = ""; for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 375, 34, { size: 26, color: "#ff6b81" });
  }
  if (p) {
    const d = p.pos[1], zone = d <= 0.5 ? "mặt nước" : d < 10 ? "nông" : d < 20 ? "giữa" : "sâu";
    text(`Độ sâu ${d.toFixed(1)} m (${zone})`, 14, 64);
    if (p.catch_cd_ticks > 0) text("Hồi bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 290, 64, { color: "#9fb3c0" });
    if (snap.day) text("Ngày " + snap.day, w - 14, 32, { size: 22, align: "right", bold: true });
    if (p.oxygen_ticks === 0 && p.pos[1] > 0.5) warn("⚠ Hết hơi! Lên mặt nước ngay", "#ff5252");
    else if (p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * 0.25 && p.pos[1] > 0.5) warn("⚠ Oxy sắp hết! (" + Math.ceil(p.oxygen_ticks / 60) + "s)", "#ff8a65");
  }
  if (monsterNear) {
    ctx.strokeStyle = HC ? "#ffeb3b" : "#a270ea"; ctx.lineWidth = 10; ctx.strokeRect(5, 5, w - 10, h - 10);
    warn("⚠ Thủy quái gần! Lên d < 10 m", "#cba6ff");
  }
  // giỏ (v1.2: cá thể có độ tươi) + danh sách cần lấy
  const hold = snap.hold || [];
  const good = hold.filter((it) => !isSpoiled(it));
  const have = counts(good.map((it) => it.kind));
  if (snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(36, (w * 0.5) / cap - 4), y0 = h - bottom - 4;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (hold[i]) itemCell(hold[i], x0, y0, sz);
    }
    const nSp = hold.length - good.length;
    text("Giỏ " + hold.length + "/" + cap + "  " + Object.keys(have).map((k) => kn(k) + "×" + have[k]).join(", ") +
         (nSp ? `  · ${nSp} ươn` : ""), 14, y0 + sz + 26, { color: nSp ? "#ffcc80" : "#e8eef2" });
  }
  if (snap.day_plan) {
    const need = snap.day_plan.ingredients || {};
    const parts = Object.keys(need).map((k) => `${kn(k)} ${have[k] || 0}/${need[k]}`);
    text("Cần lấy: " + parts.join(" · "), w - 14, h - bottom + 26, { align: "right", color: "#fff3d6" });
  }
  text("WASD bơi · E hái/cập bến · Space bắt cá · Esc/P dừng · H tương phản", w - 14, h - 14, { size: 14, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const menu = meta.menu || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 100, bottom = 50;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = HC ? "#111" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  for (let i = 1; i < 8; i++) { ctx.fillStyle = "#ffe3a3"; ctx.beginPath(); ctx.arc(sx(i * X / 8), sy(Z) + 6, 4, 0, Math.PI * 2); ctx.fill(); }  // đèn dây
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    const x = sx(st.pos[0]), y = sy(st.pos[1]);
    ctx.fillStyle = col; ctx.fillRect(x - 0.8 * s, y - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, x, y + 6, { align: "center", color: "#111", bold: true });
    if (st.dish) text(dn(st.dish.dish_id), x, y - 0.95 * s, { size: 14, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.dish && menu[st.dish.dish_id]) {
      const total = menu[st.dish.dish_id].cook_s * 60;
      bar(x - 0.9 * s, y + 0.9 * s, 1.8 * s, 10, 1 - st.cook_ticks_left / total, "#ffcc80");
    }
    if (st.state === "ready") text("CHÍN", x, y + 1.35 * s, { align: "center", color: "#1b5e20", bold: true });
  });
  const patMax = (meta.patience_s || 60) * 60;
  const angry = [];
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const x = sx(tb.pos[0]), y = sy(tb.pos[1]);
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(x, y, 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, x, y + 6, { align: "center", color: "#fff", bold: true });
    const c = byTable[tb.id];
    if (c) {
      const cy = y - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(x, cy, 0.5 * s, 0, Math.PI * 2); ctx.fill();
      text(dn(c.dish_id), x, cy - 0.65 * s, { size: 14, align: "center", color: HC ? "#fff" : "#2a1a0a" });
      if (c.state === "waiting") {
        const frac = c.patience_ticks_left / patMax;
        if (frac < 0.25) {  // khách sắp giận: biểu tượng "!" trên đầu + banner
          angry.push(tb.id);
          ctx.fillStyle = HC ? "#ffeb3b" : "#d32f2f"; ctx.beginPath(); ctx.arc(x + 0.7 * s, cy - 0.6 * s, 0.35 * s, 0, Math.PI * 2); ctx.fill();
          text("!", x + 0.7 * s, cy - 0.6 * s + 0.15 * s, { size: 22, align: "center", color: HC ? "#000" : "#fff", bold: true });
        }
        bar(x - 0.9 * s, cy + 0.6 * s, 1.8 * s, 10, frac, frac < 0.25 ? (blink() ? "#d32f2f" : "#ff8a65") : "#e57373");
      }
    }
  });
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#3e7b3a"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (HC) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke(); }
  }
  if (angry.length) warn("⚠ Khách sắp giận: " + angry.join(", "), "#ff8a80");
  // HUD
  const shift = snap.stats && snap.stats.earned_start !== undefined ? snap.earned - snap.stats.earned_start : snap.earned;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 32, { size: 24, color: timeColor(snap.time_left_ticks) });
  text(`Tiền ca ${shift ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 130, 32);
  if (snap.day) text("Ngày " + snap.day + " — tối", w - 14, 32, { size: 22, align: "right", bold: true });
  const reservedIds = new Set();
  (snap.customers || []).forEach((c) => (c.reserved || []).forEach((id) => reservedIds.add(id)));
  const stock = snap.stock || [];
  const availItems = stock.filter((it) => !reservedIds.has(it.id) && !isSpoiled(it));
  const availCounts = counts(availItems.map((it) => it.kind));
  const nSpoiled = stock.filter((it) => isSpoiled(it)).length;
  text("Kho khả dụng: " + (Object.keys(availCounts).map((k) => kn(k) + "×" + availCounts[k]).join(", ") || "(trống)") +
       (nSpoiled ? `  · ${nSpoiled} ươn` : ""), 14, 62, { color: nSpoiled ? "#ffcc80" : "#e8eef2" });
  const cellSz = 22, showN = Math.min(stock.length, Math.floor((w - 280) / (cellSz + 3)));
  for (let i = 0; i < showN; i++) itemCell(stock[i], 14 + i * (cellSz + 3), 72, cellSz);
  text("Trên tay: " + (snap.hand ? dn(snap.hand.dish_id) : "(trống)"), w - 14, 62, { align: "right", color: snap.hand ? "#fff3d6" : "#9fb3c0" });
  text("WASD đi · E tương tác (bếp / bàn) · Esc/P dừng", w - 14, h - 14, { size: 14, align: "right", color: "#9fb3c0" });
}

// ----- Shop -----
function drawShop(w, h) {
  const [x, y] = panel(w, h, 640, 400);
  const ups = ((snap.meta || {}).shop || {}).upgrades || {};
  text("Shop cuối ngày", x + 24, y + 44, { size: 28, bold: true });
  text(`Tiền: ${snap.money}k · Shop đóng sau ${Math.ceil(snap.time_left_ticks / 60)}s`, x + 24, y + 80);
  const label = { oxygen: "Bình oxy", hp: "Áo phao (thêm Máu)" };
  ["oxygen", "hp"].forEach((k, i) => {
    const lv = (snap.upgrades || {})[k] || 0, tiers = ups[k] || [];
    const next = tiers.find((t) => t.level === lv + 1);
    const eff = (t) => (k === "oxygen" ? t.oxygen_max_s + " s oxy" : t.hp_max + " Máu");
    const line = next ? `cấp ${lv} → ${next.level}: ${eff(next)} · giá ${next.price}k` : `cấp ${lv} (tối đa)`;
    const can = next && snap.money >= next.price;
    text(`${i + 1}. ${label[k]} — ${line}`, x + 24, y + 130 + i * 40, { color: next ? (can ? "#a5d6a7" : "#ef9a9a") : "#9fb3c0" });
  });
  text("Cấp mua hôm nay có hiệu lực từ Ngày kế.", x + 24, y + 230, { color: "#9fb3c0" });
  const st = Object.keys(snap.stock || {}).map((k) => kn(k) + "×" + snap.stock[k]).join(", ");
  text("Kho dư (bỏ sau Shop): " + (st || "không"), x + 24, y + 264, { color: "#9fb3c0" });
  const last = (snap.events || []).filter((e) => e.name === "bought" || e.name === "buy_failed").slice(-1)[0];
  if (last) text(last.name === "bought" ? `Đã mua ${label[last.data.upgrade]} cấp ${last.data.level}` : `Không mua được (${last.data.reason})`, x + 24, y + 310, { color: "#fff3d6" });
  text("1 / 2: mua · Enter: đóng Shop · Esc/P: dừng", x + 24, y + 370, { color: "#cfd8dc" });
}

// ----- màn hình chờ -----
function drawIntro(w, h) {
  const plan = snap.day_plan || { dishes: {}, ingredients: {} };
  if (snap.intro === "menu") {
    const [x, y] = panel(w, h, 560, 320);
    text("Quán Ăn Chợ Nổi", x + 280, y + 80, { size: 40, align: "center", bold: true, color: "#f2c230" });
    text("Út Sen lặn bắt cá, tối mở quán cho Má Tư", x + 280, y + 120, { align: "center", color: "#cfd8dc" });
    text("Enter — Chơi", x + 280, y + 200, { size: 24, align: "center" });
    text("Q — Thoát", x + 280, y + 240, { size: 24, align: "center" });
    return;
  }
  if (snap.intro === "day") {
    const [x, y] = panel(w, h, 620, 360);
    text("Ngày " + snap.day, x + 24, y + 50, { size: 32, bold: true, color: "#f2c230" });
    text("Má Tư dặn: hôm nay nấu", x + 24, y + 92);
    lines(Object.entries(plan.dishes).map(([d, n]) => `• ${dn(d)} × ${n}`), x + 40, y + 126);
    text("Cần lấy: " + Object.entries(plan.ingredients).map(([k, n]) => kn(k) + "×" + n).join(", "), x + 24, y + 300, { color: "#fff3d6" });
    text("Tự vào sau 4 s · Enter để bắt đầu", x + 24, y + 340, { size: 16, color: "#9fb3c0" });
    return;
  }
  if (snap.intro === "evening") {
    const [x, y] = panel(w, h, 620, 360);
    const menu = (snap.meta || {}).menu || {};
    const stock = snap.stock || {};
    text("Tối Ngày " + snap.day + " — mở quán", x + 24, y + 50, { size: 30, bold: true, color: "#f2c230" });
    text("Nhập kho: " + (Object.keys(stock).map((k) => kn(k) + "×" + stock[k]).join(", ") || "(trống)"), x + 24, y + 96);
    const cook = Object.keys(plan.dishes).filter((d) => menu[d] && Object.entries(menu[d].recipe).every(([k, n]) => (stock[k] || 0) >= n));
    text("Món nấu được:", x + 24, y + 136);
    lines(cook.length ? cook.map((d) => "• " + dn(d)) : ["(chưa đủ nguyên liệu món nào)"], x + 40, y + 168);
    text("Enter để mở cửa", x + 24, y + 340, { size: 16, color: "#9fb3c0" });
    return;
  }
  if (snap.intro === "result") {
    const [x, y] = panel(w, h, 620, 360);
    const st = snap.stats || {};
    const dRep = (snap.reputation - (st.reputation_start ?? snap.reputation));
    text("Kết quả Ngày " + snap.day, x + 24, y + 50, { size: 30, bold: true, color: "#f2c230" });
    lines([`Khách đã phục vụ: ${st.served || 0}`, `Khách bỏ đi: ${st.left || 0}`,
           `Thu trong ngày: ${snap.earned - (st.earned_start || 0)}k (boa ${st.tips || 0}k)`,
           `Tiền hiện có: ${snap.money}k`, `Uy tín: ${snap.reputation.toFixed(1)} (${dRep >= 0 ? "+" : ""}${dRep.toFixed(1)})`],
          x + 24, y + 100, 36);
    text("Enter để vào Shop", x + 24, y + 340, { size: 16, color: "#9fb3c0" });
  }
}
function drawSummary(w, h) {
  const [x, y] = panel(w, h, 620, 360);
  const t = snap.totals || {}, sold = t.sold || {};
  const best = Object.keys(sold).sort((a, b) => sold[b] - sold[a] || (a < b ? -1 : 1))[0];
  text("Tổng kết", x + 24, y + 50, { size: 32, bold: true, color: "#f2c230" });
  lines([`Số Ngày: ${snap.meta.days || snap.day}`, `Tổng thu: ${snap.earned}k · Tiền còn: ${snap.money}k`, `Tổng điểm: ${snap.score}`,
         `Uy tín: ${snap.reputation.toFixed(1)}`, `Khách phục vụ: ${t.served || 0} · bỏ đi: ${t.left || 0}`,
         "Món bán chạy: " + (best ? `${dn(best)} (${sold[best]})` : "—")], x + 24, y + 100, 36);
  text("Enter — về menu", x + 24, y + 340, { size: 16, color: "#9fb3c0" });
}
function drawPause(w, h) {
  const [x, y] = panel(w, h, 420, 220);
  text("Tạm dừng", x + 210, y + 60, { size: 32, align: "center", bold: true });
  text("Esc / P — Tiếp tục", x + 210, y + 120, { size: 22, align: "center" });
  text("M — Về menu", x + 210, y + 160, { size: 22, align: "center" });
}
function overlay(w, h) {
  if (offline) text(quitted ? "Đã thoát. Có thể đóng tab." : "Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, h / 2, { align: "center", color: "#ff8a80", size: 22 });
  if (snap.error) text("Luật báo lỗi — xem terminal.", w / 2, 90, { align: "center", color: "#ff8a80" });
  if (snap.mode === "day" && snap.finished) { drawSummary(w, h); return; }
  if (snap.ui_hold && snap.intro) { drawIntro(w, h); return; }
  if (snap.state === "paused") { drawPause(w, h); return; }
  if (snap.finished) {
    panel(w, h, 420, 120);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 8, { align: "center", size: 22 });
    text("R để chơi lại", w / 2, h / 2 + 28, { align: "center", color: "#cfd8dc" });
  }
}

// ---------- benchmark (python3 -m chonoi.bench): ?bench=1&warmup=3&duration=30 ----------
const QS = new URLSearchParams(location.search);
const BENCH = QS.get("bench") === "1" ? { warm: +QS.get("warmup") * 1000, dur: +QS.get("duration") * 1000,
  first: null, start: null, last: null, deltas: [], sent: false } : null;
function benchTick(now) {
  if (!BENCH || BENCH.sent || !snap) return;
  if (BENCH.first === null) {  // khung hình đầu tiên của cảnh đo
    BENCH.first = now;
    fetch("/bench", { method: "POST", body: JSON.stringify({ event: "first_frame", t: Date.now() }) });
    return;
  }
  if (now - BENCH.first < BENCH.warm) return;  // làm nóng
  if (BENCH.start === null) { BENCH.start = BENCH.last = now; return; }
  BENCH.deltas.push((now - BENCH.last) / 1000); BENCH.last = now;
  if (now - BENCH.start >= BENCH.dur) {
    BENCH.sent = true;
    const frames = BENCH.deltas.length, measured_s = (now - BENCH.start) / 1000;
    const k = Math.max(1, Math.ceil(0.01 * frames));
    const slow = BENCH.deltas.slice().sort((a, b) => b - a).slice(0, k);
    const p1 = 1 / (slow.reduce((a, b) => a + b, 0) / k);
    fetch("/bench", { method: "POST", body: JSON.stringify({ event: "result", frames, measured_s, p1_low_fps: p1 }) });
  }
}

function frame(now) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const ph = snap.phase || snap.mode;
    if (ph === "quan") drawQuan(w, h);
    else if (ph === "shop") drawShop(w, h);
    else drawGather(w, h);
    eventLog(w, h);
    if (!(snap.ui_hold && snap.intro) && snap.state !== "paused") drawWarnings(w); else warnings = [];
    if (HC) text("Tương phản cao (H)", w - 14, h - 40, { size: 16, align: "right", color: "#ffeb3b" });
    overlay(w, h);
    benchTick(now);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22 });
  }
}
requestAnimationFrame(frame);
</script>
